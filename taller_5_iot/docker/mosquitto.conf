# Mosquitto Lab 5 — broker local dentro del contenedor.
# allow_anonymous sin clave SOLO es seguro porque el puerto 1883 NO se
# publica al host (no hay "ports:" en compose): solo lo ven los contenedores
# de la red interna publisher/ingest. Si algn da se publica, esto es una
# puerta abierta — anotado en el README y en Riesgos del plan.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout

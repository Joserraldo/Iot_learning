# iotcentraljose.duckdns.org — VM nueva (2026-10-16). Solo taller 5 en esta
# maquina: /taller5/ didactico (8090) y /taller5/grafana/ (3000).
# certbot --nginx anyade despues el bloque 443 SSL copiando estas locations.
server {
    listen 80;
    listen [::]:80;
    server_name iotcentraljose.duckdns.org;

    location /taller5/grafana/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /taller5/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # raiz y todo lo demas -> el didactico del taller 5
    location / {
        return 301 https://$host/taller5/;
    }
}
